  comment: CLEO Europe に参加しました。大変よい会議でした。ポスター発表しました。 ビアガーデンか何か知らないけれど、ビールを浴びない人間としてはまるで食指が動きません。シュヴァイネハクセとかソーセージとかチーズとか食べ物は全て美味しすぎて食べまくりました。
