  comment: AQIS2013。大変よい会議でした。口頭発表しました。 まだ薄もやがかかりひっそりと静まり返った明け方に、怒りモードの野犬数匹に吠えられ追いかけられるという悲惨な目に遭いました。きゃつらの前で走ってはいけないという重要なことを学びました。
