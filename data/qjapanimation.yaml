schema_version: 1
page:
  site_title: Qjapanimation
  title: 日本アニメ／漫画（ときどきその他）で描かれる量子情報処理に関する話題
  author: 生田力三
  description: 日本アニメ・漫画などに登場する量子情報処理、量子力学、量子コンピュータに関する話題の一覧
  footnote: 年は作品公開年を基本とし、一部に年不明の項目を含みます。
  pdf_label: PDF版
  updated: '2026-09-02'
intro:
- text: 2015年頃から少しずつ更新している、発展途上の一覧です。
- text: 漫画・アニメなど複数のメディアに作品がある場合、特に断りがない限りアニメの年を記載しています。
- text: 関連情報をご存じでしたら、お知らせいただけると幸いです。
- text: シュレーディンガーの猫が登場する作品は非常に多いため、特別なものを除き後半の表にまとめています。
- prefix: ''
  link_text: 「量子の未来」をめぐる23の話題
  url: https://doi.org/10.18910/92424
  suffix: （2023年8月17日）の「話題19」で本ページが紹介されました。
