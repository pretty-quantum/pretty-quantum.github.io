name: Build publications from BibTeX

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate publications.html
        run: python generate_publications.py

      - name: Commit generated page if changed
        shell: bash
        run: |
          if git diff --quiet -- publications.html; then
            echo "publications.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add publications.html
          git commit -m "Update publications from ikuta.bib"
          git push
