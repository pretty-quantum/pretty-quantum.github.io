<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rikizo Ikuta's website">
  <title>Rikizo Ikuta's website</title>
  <style>
    :root {
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --link: #1a73e8;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Helvetica Neue", Helvetica, "Noto Sans JP",
                   "Yu Gothic", "YuGothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Google Sites風の上部ナビゲーション */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 28px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid transparent;
    }

    .site-title {
      flex: 1 1 auto;
      min-width: 220px;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .1px;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav a {
      position: relative;
      padding: 22px 0 19px;
      color: #3c4043;
    }

    .nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      height: 2px;
      background: #202124;
    }

    .search {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: default;
      color: #5f6368;
    }

    .search svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ページタイトル */
    .hero {
      min-height: 245px;
      display: flex;
      align-items: center;
      background: #f8f9fa;
    }

    .hero-inner {
      width: min(1120px, calc(100% - 72px));
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.14;
      font-weight: 400;
      letter-spacing: -.7px;
    }

    /* 本文 */
    main {
      width: min(1120px, calc(100% - 72px));
      margin: 0 auto;
      padding: 58px 0 110px;
    }

    .page-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      margin-bottom: 54px;
    }

    .page-links a {
      color: var(--link);
      font-size: 18px;
      line-height: 1.6;
    }

    .page-links a:hover,
    .notice a:hover {
      text-decoration: underline;
    }

    .notice {
      font-size: 15px;
      line-height: 1.8;
      color: #3c4043;
    }

    .notice a {
      color: var(--link);
    }

    footer {
      width: min(1120px, calc(100% - 72px));
      margin: 0 auto;
      padding: 22px 0 30px;
      border-top: 1px solid #f1f3f4;
      color: var(--muted);
      font-size: 12px;
    }

    /* スマートフォン */
    @media (max-width: 760px) {
      .site-header {
        height: auto;
        min-height: 58px;
        padding: 12px 18px;
        flex-wrap: wrap;
        gap: 8px 18px;
      }

      .site-title {
        width: 100%;
        min-width: 0;
        font-size: 18px;
      }

      .nav {
        width: 100%;
        gap: 18px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .nav a {
        padding: 7px 0 10px;
      }

      .nav a.active::after {
        bottom: 3px;
      }

      .search { display: none; }

      .hero {
        min-height: 190px;
      }

      .hero-inner,
      main,
      footer {
        width: min(100% - 38px, 1120px);
      }

      main {
        padding-top: 40px;
      }

      .page-links a {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="site-title" href="./">Rikizo Ikuta's website</a>

    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="./">ホーム</a>
      <a href="https://sites.google.com/view/pretty-quantum/guide">道しるべ</a>
      <a href="https://sites.google.com/view/pretty-quantum/qjapanimation">
        日本アニメ（など）で描かれる量子情報およびその周辺
      </a>
    </nav>

    <button class="search" aria-label="Search" title="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 4a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0-2a7.5 7.5 0 1 1 4.71 13.34l5.22 5.23-1.42 1.41-5.22-5.22A7.5 7.5 0 0 1 9.5 2z"/>
      </svg>
    </button>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Rikizo Ikuta's website</h1>
    </div>
  </section>

  <main>
    <div class="page-links">
      <a href="https://sites.google.com/view/pretty-quantum/guide">道しるべ</a>
      <a href="https://sites.google.com/view/pretty-quantum/qjapanimation">
        日本アニメ（など）で描かれる量子情報およびその周辺
      </a>
    </div>

    <p class="notice">
      2026/7/20
      <a href="http://ikuta.ocoao.info/">ikuta.ocoao.info</a>
      から google のページに引っ越しを始めました
    </p>
  </main>

  <footer>
    Rikizo Ikuta's website
  </footer>
</body>
</html>
